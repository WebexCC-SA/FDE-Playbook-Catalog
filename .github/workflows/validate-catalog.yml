name: Validate Playbook Catalog

on:
  pull_request:
    branches:
      - main
    paths:
      - "Playbooks/**"
      - "playbook-site/**"
      - "scripts/build_playbook_catalog.py"
      - "scripts/import_playbook.py"
      - "tests/**"
      - ".github/workflows/validate-catalog.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-playbook-catalog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Test importer and build catalog
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: playbook-site/requirements.txt

      - name: Install dependencies
        run: python -m pip install --requirement playbook-site/requirements.txt

      - name: Test strict importer controls
        run: python -m unittest discover --start-directory tests --verbose

      - name: Generate catalog
        run: python scripts/build_playbook_catalog.py

      - name: Build catalog website
        run: |
          mkdocs build \
            --strict \
            --config-file playbook-site/mkdocs.yml \
            --site-dir "${RUNNER_TEMP}/catalog-site"
