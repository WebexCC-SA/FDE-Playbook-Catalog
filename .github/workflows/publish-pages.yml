name: Publish Playbook Catalog

on:
  push:
    branches:
      - main
    paths:
      - "Playbooks/**"
      - "playbook-site/**"
      - "scripts/build_playbook_catalog.py"
      - ".github/workflows/publish-pages.yml"

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: playbook-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build catalog
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install MkDocs
        run: python -m pip install --requirement playbook-site/requirements.txt

      - name: Generate playbook catalog
        run: python scripts/build_playbook_catalog.py

      - name: Build catalog website
        run: |
          cd playbook-site
          mkdocs build --strict --site-dir ../public

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload catalog website
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    name: Deploy catalog
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
